<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | DNexus Corp</title>

    <!-- SEO: noindex for error pages -->
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The page you're looking for doesn't exist. Return to DNexus Corp's homepage or explore our digital services." />
    <link rel="canonical" href="https://www.dnexuscorp.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="404 — Page Not Found | DNexus Corp" />
    <meta property="og:description" content="This page doesn't exist. Head back to DNexus Corp." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dnexuscorp.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="Assets/dnexus-corp-logo.webp" />
    <link rel="apple-touch-icon" href="Assets/dnexus-corp-logo.webp" />

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

    <style>
      :root {
        --c-bg: #08090a;
        --c-surface: #0f1012;
        --c-panel: #141618;
        --c-border: rgba(255,255,255,0.07);
        --c-border-hi: rgba(0, 120, 190,0.35);
        --c-primary: #0078be;
        --c-secondary: #00b098;
        --c-white: #f0ede8;
        --c-muted: #7a7a80;
        --grad-brand: linear-gradient(135deg,#0078be 0%,#00b098 100%);
        --f-display: "Syne",sans-serif;
        --f-body: "DM Sans",sans-serif;
      }

      *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
        width: 100%;
        max-width: 100%;
      }

      body {
        font-family: var(--f-body);
        background: var(--c-bg);
        color: var(--c-white);
        min-height: 100vh;
        width: 100%;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      h1,h2,h3 { font-family: var(--f-display); }
      a { text-decoration: none; }

      ::selection { background: var(--c-primary); color: #000; }

      /* Noise */
      body::before {
        content: ""; position: fixed; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
        opacity: 0.025; pointer-events: none; z-index: 0;
      }

      /* ── AMBIENT ORBS ── */
      .orb {
        position: fixed; border-radius: 50%; filter: blur(80px);
        pointer-events: none; animation: orb-drift 8s ease-in-out infinite alternate;
      }
      .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle,rgba(0, 120, 190,0.2) 0%,transparent 70%); top: -200px; right: -100px; animation-delay: 0s; }
      .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle,rgba(255,145,0,0.12) 0%,transparent 70%); bottom: -100px; left: -80px; animation-delay: 2s; }
      .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle,rgba(0, 120, 190,0.06) 0%,transparent 70%); top: 40%; left: 20%; animation-delay: 4s; }
      @keyframes orb-drift {
        0% { transform: translate(0,0) scale(1); }
        100% { transform: translate(20px,-20px) scale(1.05); }
      }

      /* ── GRID BACKGROUND ── */
      body::after {
        content: ""; position: fixed; inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
          linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);
        pointer-events: none; z-index: 0;
      }

      /* ── MAIN CONTAINER ── */
      .error-wrap {
        position: relative; z-index: 1;
        text-align: center; padding: 40px 24px;
        max-width: 640px; width: 100%;
      }

      /* ── 404 GLITCH ── */
      .error-code-wrap { position: relative; margin-bottom: 8px; }
      .error-code {
        font-family: var(--f-display);
        font-size: clamp(6rem,22vw,11rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        background: var(--grad-brand);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        position: relative;
        display: inline-block;
        animation: glitch-jitter 4s ease-in-out infinite;
      }
      .error-code::before, .error-code::after {
        content: "404";
        position: absolute;
        top: 0; left: 0;
        font-family: var(--f-display);
        font-size: inherit;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        pointer-events: none;
      }
      .error-code::before {
        background: linear-gradient(135deg,#ff0080,#0078be);
        -webkit-background-clip: text;
        background-clip: text;
        animation: glitch-shift-1 4s ease-in-out infinite;
        clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      }
      .error-code::after {
        background: linear-gradient(135deg,#00bfff,#00b098);
        -webkit-background-clip: text;
        background-clip: text;
        animation: glitch-shift-2 4s ease-in-out infinite;
        clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      }
      @keyframes glitch-jitter {
        0%,90%,100% { transform: translate(0); }
        91% { transform: translate(-2px,1px); }
        93% { transform: translate(2px,-1px); }
        95% { transform: translate(-1px,2px); }
        97% { transform: translate(1px,-1px); }
      }
      @keyframes glitch-shift-1 {
        0%,89%,100% { transform: translate(0); opacity: 0; }
        90% { transform: translate(-4px,0); opacity: 0.7; }
        93% { transform: translate(3px,0); opacity: 0.5; }
        96% { transform: translate(-2px,0); opacity: 0.3; }
        99% { opacity: 0; }
      }
      @keyframes glitch-shift-2 {
        0%,89%,100% { transform: translate(0); opacity: 0; }
        90% { transform: translate(4px,0); opacity: 0.7; }
        93% { transform: translate(-3px,0); opacity: 0.5; }
        96% { transform: translate(2px,0); opacity: 0.3; }
        99% { opacity: 0; }
      }

      /* ── LOGO ── */
      .error-logo { margin-bottom: 24px; }
      .error-logo img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 20px rgba(0, 120, 190,0.3); }

      /* ── TEXT ── */
      .error-title {
        font-family: var(--f-display);
        font-size: clamp(1.4rem,4vw,2rem);
        font-weight: 800;
        margin-bottom: 12px;
        letter-spacing: -0.03em;
      }
      .error-desc {
        font-size: 0.9rem;
        color: var(--c-muted);
        line-height: 1.7;
        max-width: 460px;
        margin: 0 auto 32px;
      }

      /* ── BUTTONS ── */
      .btn-brand {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--grad-brand); color: #000;
        font-family: var(--f-display); font-weight: 700; font-size: 0.9rem;
        padding: 13px 28px; border-radius: 100px; border: none; cursor: pointer;
        transition: transform 0.25s, box-shadow 0.25s; white-space: nowrap;
        position: relative; overflow: hidden;
      }
      .btn-brand::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,0.15); opacity: 0; transition: opacity 0.25s; }
      .btn-brand:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0, 120, 190,0.4); color: #000; }
      .btn-brand:hover::after { opacity: 1; }
      .btn-outline {
        display: inline-flex; align-items: center; gap: 8px;
        background: transparent; color: var(--c-white);
        font-family: var(--f-display); font-weight: 600; font-size: 0.9rem;
        padding: 12px 28px; border-radius: 100px;
        border: 1px solid var(--c-border); cursor: pointer; transition: all 0.25s; white-space: nowrap;
      }
      .btn-outline:hover { border-color: var(--c-primary); color: var(--c-primary); }

      .error-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 40px; }

      /* ── QUICK LINKS ── */
      .quick-links {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
        padding: 20px; background: var(--c-panel); border: 1px solid var(--c-border);
        border-radius: 20px;
      }
      .ql-label { font-size: 0.7rem; color: var(--c-muted); letter-spacing: 0.1em; text-transform: uppercase; width: 100%; text-align: center; margin-bottom: 6px; }
      .ql-link {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--c-bg); border: 1px solid var(--c-border);
        color: var(--c-muted); font-size: 0.78rem; padding: 7px 14px;
        border-radius: 100px; transition: all 0.25s;
      }
      .ql-link i { font-size: 0.7rem; color: var(--c-primary); }
      .ql-link:hover { border-color: var(--c-border-hi); color: var(--c-white); }

      /* ── DIVIDER ── */
      .error-divider {
        display: flex; align-items: center; gap: 12px;
        margin: 28px 0; color: var(--c-muted); font-size: 0.75rem; letter-spacing: 0.1em;
      }
      .error-divider::before, .error-divider::after { content: ""; flex: 1; height: 1px; background: var(--c-border); }

      /* ── FLOATING PARTICLES ── */
      .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
      .particle {
        position: absolute; width: 2px; height: 2px; border-radius: 50%;
        background: var(--c-primary); opacity: 0;
        animation: particle-float linear infinite;
      }
      @keyframes particle-float {
        0% { transform: translateY(100vh) scale(0); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.3; }
        100% { transform: translateY(-20px) scale(1); opacity: 0; }
      }

      /* ── RESPONSIVE ── */
      @media (max-width: 575px) {
        .error-wrap { padding: 24px 16px; }
        .error-btns { flex-direction: column; align-items: center; }
        .error-btns .btn-brand, .error-btns .btn-outline { width: 100%; justify-content: center; }
        .quick-links { gap: 6px; }
        .ql-link { font-size: 0.72rem; padding: 6px 12px; }
      }
    </style>
  </head>
  <body>
    <!-- Ambient Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Floating Particles -->
    <div class="particles" aria-hidden="true" id="particles"></div>

    <!-- Main Error Content -->
    <div class="container">
      <div class="error-wrap mx-auto">

        <!-- Logo -->
        <div class="error-logo" data-aos="fade-down">
          <a href="index.html" aria-label="DNexus Corp Home">
            <img src="Assets/dnexus-corp-logo.webp" alt="DNexus Corp Logo" />
          </a>
        </div>

        <!-- Glitch 404 -->
        <div class="error-code-wrap">
          <div class="error-code" aria-label="Error 404">404</div>
        </div>

        <!-- Title & Desc -->
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-desc">
          The page you're looking for has drifted into the digital void. It may have been moved, renamed, or never existed — but your journey doesn't have to end here.
        </p>

        <!-- Action Buttons -->
        <div class="error-btns">
          <a href="index.html" class="btn-brand" id="btn-home">
            <i class="fas fa-home"></i> Back to Home
          </a>
          <a href="contact.html" class="btn-outline" id="btn-contact">
            <i class="fas fa-envelope"></i> Contact Us
          </a>
        </div>

        <!-- Divider -->
        <div class="error-divider">Or explore our pages</div>

        <!-- Quick Links -->
        <div class="quick-links">
          <div class="ql-label">Navigate to</div>
          <a href="about-us.html" class="ql-link" id="ql-about"><i class="fas fa-info-circle"></i> About Us</a>
          <a href="services.html" class="ql-link" id="ql-services"><i class="fas fa-layer-group"></i> Services</a>
          <a href="clients.html" class="ql-link" id="ql-clients"><i class="fas fa-handshake"></i> Clients</a>
          <a href="portfolio.html" class="ql-link" id="ql-portfolio"><i class="fas fa-briefcase"></i> Portfolio</a>
          <a href="https://wa.me/919080654251" target="_blank" class="ql-link" id="ql-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>

      </div>
    </div>

    <script>
      /* Floating Particles */
      (function () {
        const container = document.getElementById("particles");
        const count = 18;
        for (let i = 0; i < count; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "vw";
          p.style.width = p.style.height = (Math.random() * 3 + 1) + "px";
          p.style.animationDuration = (Math.random() * 10 + 8) + "s";
          p.style.animationDelay = (Math.random() * 8) + "s";
          p.style.opacity = (Math.random() * 0.5 + 0.2).toString();
          container.appendChild(p);
        }
      })();

      /* Mouse-parallax orbs */
      let mX = 0, mY = 0, cX = 0, cY = 0;
      document.addEventListener("mousemove", e => {
        mX = e.clientX / window.innerWidth - 0.5;
        mY = e.clientY / window.innerHeight - 0.5;
      });
      (function animate() {
        cX += (mX - cX) * 0.06; cY += (mY - cY) * 0.06;
        const o1 = document.querySelector(".orb-1"), o2 = document.querySelector(".orb-2"), o3 = document.querySelector(".orb-3");
        if (o1) o1.style.transform = `translate(${cX * -50}px,${cY * -50}px)`;
        if (o2) o2.style.transform = `translate(${cX * 35}px,${cY * 35}px)`;
        if (o3) o3.style.transform = `translate(${cX * -20}px,${cY * -20}px)`;
        requestAnimationFrame(animate);
      })();

      /* Auto-redirect countdown (optional, uncomment to enable) */
      // let secs = 15;
      // const interval = setInterval(() => {
      //   if (--secs <= 0) { clearInterval(interval); window.location.href = "index.html"; }
      // }, 1000);
    </script>
  </body>
</html>
